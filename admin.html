<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Minto Quiz · Bộ câu hỏi</title>
<link rel="icon" type="image/png" href="/fav-64.png?v=3">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/quiz.css?v=22">
</head>
<body>
  <div class="bar"><a class="logo" href="admin.html">Minto Quiz</a><span class="muted">Bộ câu hỏi</span><span class="sp"></span><button class="btn sm" id="bNews" hidden>✨ Có gì mới</button><a class="btn sm" href="ket-qua.html">📒 Lịch sử kết quả</a><a class="btn sm" href="host.html">Màn host ▶</a></div>
  <div class="wrap" id="app"><div class="muted">Đang tải…</div></div>

  <template id="tList">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1 style="margin:0;flex:1">Bộ câu hỏi của thầy</h1><button class="btn pri" id="bNew">+ Bộ mới</button></div>
    <p class="muted">Tạo bộ mới bằng cách tải file Excel mẫu Kahoot, CSV, Word, PDF hoặc dán văn bản đề. Bộ câu hỏi lưu trên Firebase, chỉ tài khoản giáo viên đọc được.</p>
    <div id="list" class="qlist"></div>
    <h2 style="margin:28px 0 4px">🎵 Nhạc theme</h2>
    <p class="muted" style="margin-top:0">Bài nhạc nền cho từng theme trên màn chiếu. File nhạc lưu trên Firebase, chỉ tài khoản giáo viên nghe được (không để công khai trên GitHub). Theme chưa có nhạc thì dùng nhạc tự tạo.</p>
    <div id="music" class="qlist"><div class="muted">Đang tải…</div></div>
  </template>

  <template id="tEdit">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn sm" id="bBack">← Danh sách</button>
      <input id="title" placeholder="Tên bộ câu hỏi" maxlength="120" style="flex:1;min-width:220px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;font-size:18px">
      <select id="lop" title="Lớp của bộ câu hỏi" style="padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-weight:600;background:#fff"></select>
    </div>
    <div class="drop" id="drop">
      <b>Kéo thả file vào đây</b> hoặc <label class="btn sm" style="cursor:pointer">Chọn file<input type="file" id="file" accept=".xlsx,.xls,.csv,.txt,.docx,.pdf" hidden></label>
      <div class="muted" style="font-size:14px;margin-top:6px">.xlsx (mẫu Kahoot) · .csv · .txt · .docx · .pdf — file chỉ được đọc ngay trên máy này, không gửi đi đâu.</div>
      <details style="margin-top:10px;text-align:left"><summary style="cursor:pointer">Hoặc dán văn bản đề</summary>
        <textarea id="paste" rows="8" style="width:100%;margin-top:8px;padding:10px;border:1.5px solid var(--line);border-radius:10px" placeholder="1. Emily introduced ____ before beginning the job interview.&#10;(A) she  (B) herself  (C) hers  (D) her&#10;Answer: B"></textarea>
        <button class="btn sm" id="bPaste">Đọc văn bản</button>
      </details>
    </div>
    <div id="imp" class="muted" style="margin:10px 0" role="status"></div>
    <div id="sum" style="margin:10px 0"></div>
    <div id="qs" style="display:grid;gap:12px"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:0;background:var(--paper);padding:10px 0;border-top:1px solid var(--line)">
      <button class="btn" id="bAdd">+ Thêm câu</button>
      <span style="flex:1"></span>
      <button class="btn" id="bXlsx">⬇ Xuất Excel (mẫu Kahoot)</button>
      <button class="btn" id="bSave">💾 Lưu</button>
      <button class="btn pri" id="bPlay">Lưu & tạo phòng ▶</button>
    </div>
  </template>
<script src="/acc.js?v=9"></script>
<script src="js/parse.js?v=2"></script>
<script src="cap-nhat.js?v=16"></script>
<script type="module" src="js/admin.js?v=18"></script>
</body>
</html>
